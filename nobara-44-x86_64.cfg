gpgcheck=0
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara-pubkey
       file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara-baseos-pubkey-42
       file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara-baseos-pubkey-43
       file:///etc/pki/rpm-gpg/RPM-GPG-KEY-nobara-baseos-pubkey-44
       https://download.copr.fedorainfracloud.org/results/gloriouseggroll/nobara-44/pubkey.gpg
repo_gpgcheck=0
